<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>StarSlip</title>
<meta name="description" content="One tap. Slip from orbit to orbit and chase the stars.">
<meta name="theme-color" content="#0d0b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StarSlip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-screen canvas, score floating on top, overlays for start and game over. Single night-sky look. */
:root{
  --bg:#0d0b24; --fg:#fff7ec; --muted:#b7b0d8; --coral:#ff7a6b; --mint:#6ff2c2; --sun:#ffd166;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stage{position:relative;height:100%;max-width:560px;margin:0 auto}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#score{position:absolute;left:0;right:0;top:max(18px,env(safe-area-inset-top,0px));text-align:center;font-size:56px;font-weight:700;
  pointer-events:none;text-shadow:0 4px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
#best{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));font-size:14px;color:var(--muted);pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  background:rgba(13,11,36,.55)}
.ov h1{margin:0;font-size:58px;line-height:.95;font-weight:700;letter-spacing:.01em}
.ov h1 span{color:var(--sun)}
.ov p{margin:0;color:var(--muted);font-size:17px;max-width:26ch;text-wrap:balance}
.ov .num{font-size:72px;font-weight:700;color:var(--sun);line-height:1}
.btn{font-family:var(--font);font-size:22px;font-weight:700;background:var(--coral);color:#2a0f0b;border:0;border-radius:999px;
  padding:14px 40px;cursor:pointer;box-shadow:0 5px 0 #c4483b}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4483b}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.hint{font-size:14px;color:var(--muted)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="StarSlip game"></canvas>
  <div id="score" hidden>0</div>
  <div id="best"></div>
  <div class="ov" id="ov">
    <h1>STAR<span>SLIP</span></h1>
    <p>Tap to slip free. Catch the next orbit.</p>
    <button class="btn" id="go">PLAY</button>
    <span class="hint">Grab stars on the way for bonus points.</span>
  </div>
</div>

<script>
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);}
new ResizeObserver(resize).observe(cv);resize();

const HUES=["#ff7a6b","#6ff2c2","#ffd166","#8fa8ff","#ff9ad5","#9be15d"];
let best=0;try{best=+localStorage.getItem("orbithop-best")||0}catch(e){}
const bestEl=document.getElementById("best"),scoreEl=document.getElementById("score");
function showBest(){bestEl.textContent=best?"BEST "+best:"";}
showBest();

// background stars (screen-space with parallax)
const sky=[...Array(90)].map(()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4,p:Math.random()*.5+.1,tw:Math.random()*6}));

let S; // game state
function newState(){
  return {mode:"idle",score:0,camY:0,t:0,planets:[],stars:[],trail:[],bursts:[],
    p:{state:"orbit",pl:null,a:-Math.PI/2,dir:1,x:0,y:0,vx:0,vy:0,fly:0,from:null},nextIdx:0,maxIdx:0,shake:0};
}
function gap(){return Math.max(150,Math.min(240,H*0.29));}
function addPlanet(){
  const i=S.nextIdx++;
  const prev=S.planets[S.planets.length-1];
  const lvl=Math.min(1,i/30);
  const orbitR=58-16*lvl+Math.random()*8;
  const margin=orbitR+18;
  let x;
  if(!prev) x=W/2;
  else {do{x=margin+Math.random()*(W-2*margin);}while(Math.abs(x-prev.bx)<W*0.18&&W>300);}
  const y=prev?prev.y-gap()*(0.85+Math.random()*0.3):H*0.68;
  const moving=i>8&&Math.random()<Math.min(0.6,(i-8)*0.05);
  if(moving) x=W/2;
  const pl={i,bx:x,x,y,r:orbitR*0.42,orbitR,hue:HUES[i%HUES.length],
    spin:(Math.random()<.5?1:-1),omega:(2.1+lvl*1.6)*(0.9+Math.random()*0.2),
    amp:moving?Math.min(W*0.28,W/2-margin):0,mf:0.6+Math.random()*0.6,mph:Math.random()*6};
  S.planets.push(pl);
  if(prev&&Math.random()<0.55){ // a star somewhere between the two planets
    const f=0.35+Math.random()*0.3;
    S.stars.push({x:prev.bx+(x-prev.bx)*f+(Math.random()-.5)*60,y:prev.y+(y-prev.y)*f,got:false,ph:Math.random()*6});
  }
}
function start(){
  S=newState();S.mode="play";
  for(let k=0;k<7;k++)addPlanet();
  const p=S.p;p.pl=S.planets[0];p.dir=p.pl.spin;
  S.camY=p.pl.y-H*0.68;
  document.getElementById("ov").hidden=true;scoreEl.hidden=false;scoreEl.textContent="0";
}
function release(){
  if(!S||S.mode!=="play")return;
  const p=S.p;if(p.state!=="orbit")return;
  const pl=p.pl,speed=Math.max(480,H*0.75);
  p.vx=-Math.sin(p.a)*p.dir*speed;p.vy=Math.cos(p.a)*p.dir*speed;
  p.state="fly";p.fly=0;p.from=pl;
}
function over(){
  S.mode="over";S.shake=12;
  burst(S.p.x,S.p.y,"#ff7a6b",26);
  if(S.score>best){best=S.score;try{localStorage.setItem("orbithop-best",best)}catch(e){}}
  showBest();
  setTimeout(()=>{
    const ov=document.getElementById("ov");
    ov.innerHTML=`<p>Slipped into the void</p><div class="num">${S.score}</div><p>Best: ${best}</p><button class="btn" id="go">AGAIN</button>`;
    ov.hidden=false;scoreEl.hidden=true;document.getElementById("go").onclick=start;
  },650);
}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=40+Math.random()*200;
  S.bursts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,col});}}
function addScore(n,x,y,col){S.score+=n;scoreEl.textContent=S.score;burst(x,y,col,12);}

function update(dt){
  S.t+=dt;
  for(const pl of S.planets) pl.x=pl.bx+(pl.amp?Math.sin(S.t*pl.mf+pl.mph)*pl.amp:0);
  const p=S.p;
  if(S.mode==="play"){
    if(p.state==="orbit"){
      const pl=p.pl;p.a+=p.dir*pl.omega*dt*(58/pl.orbitR);
      p.x=pl.x+Math.cos(p.a)*pl.orbitR;p.y=pl.y+Math.sin(p.a)*pl.orbitR;
    } else {
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.fly+=dt;
      for(const pl of S.planets){
        if(pl===p.from&&p.fly<0.35)continue;
        const dx=p.x-pl.x,dy=p.y-pl.y,d=Math.hypot(dx,dy);
        if(d<=pl.orbitR+4){
          const a=Math.atan2(dy,dx);
          const tang=(-Math.sin(a))*p.vx+Math.cos(a)*p.vy;
          p.state="orbit";p.pl=pl;p.a=a;p.dir=tang>=0?1:-1;
          if(pl.i>S.maxIdx){addScore(pl.i-S.maxIdx,pl.x,pl.y,pl.hue);S.maxIdx=pl.i;}
          break;
        }
      }
      const top=S.camY,bot=S.camY+H;
      if(p.state==="fly"&&(p.x<-30||p.x>W+30||p.y>bot+30||p.y<top-260||p.fly>2.6)){over();}
    }
    for(const s of S.stars){if(!s.got&&Math.hypot(s.x-p.x,s.y-p.y)<22){s.got=true;addScore(1,s.x,s.y,"#ffd166");}}
    // camera follows the current planet
    if(p.state==="orbit"){const target=p.pl.y-H*0.68;S.camY+=(target-S.camY)*Math.min(1,dt*3.2);}
    // keep planets coming, drop old ones
    while(S.planets[S.planets.length-1].y>S.camY-H*0.6)addPlanet();
    S.planets=S.planets.filter(pl=>pl.y<S.camY+H+200||pl===p.pl);
    S.stars=S.stars.filter(s=>s.y<S.camY+H+100);
    S.trail.push({x:p.x,y:p.y});if(S.trail.length>22)S.trail.shift();
  }
  for(const b of S.bursts){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.95;b.vy*=.95;b.life-=dt;}
  S.bursts=S.bursts.filter(b=>b.life>0);
  S.shake=Math.max(0,S.shake-40*dt);
}

function draw(){
  cx.save();
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0d0b24");g.addColorStop(1,"#241a4a");
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const cam=S?S.camY:0,t=S?S.t:performance.now()/1000;
  for(const s of sky){const y=((s.y*H-cam*s.p)%H+H)%H;cx.globalAlpha=.35+.35*Math.sin(t*1.5+s.tw);
    cx.fillStyle="#fff7ec";cx.fillRect(s.x*W,y,s.s,s.s);}
  cx.globalAlpha=1;
  if(!S){cx.restore();return;}
  if(S.shake)cx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  cx.translate(0,-cam);
  // planets
  for(const pl of S.planets){
    const cur=S.p.pl===pl&&S.p.state==="orbit";
    cx.strokeStyle=pl.hue;cx.globalAlpha=cur?.55:.3;cx.lineWidth=2;cx.setLineDash([4,7]);
    cx.beginPath();cx.arc(pl.x,pl.y,pl.orbitR,0,7);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1;
    cx.shadowColor=pl.hue;cx.shadowBlur=24;cx.fillStyle=pl.hue;cx.beginPath();cx.arc(pl.x,pl.y,pl.r,0,7);cx.fill();cx.shadowBlur=0;
    cx.fillStyle="rgba(255,255,255,.25)";cx.beginPath();cx.arc(pl.x-pl.r*.3,pl.y-pl.r*.3,pl.r*.35,0,7);cx.fill();
    cx.fillStyle="rgba(0,0,0,.12)";cx.beginPath();cx.arc(pl.x+pl.r*.25,pl.y+pl.r*.2,pl.r*.22,0,7);cx.fill();
  }
  // stars to collect
  for(const s of S.stars){if(s.got)continue;const k=1+.15*Math.sin(S.t*5+s.ph);
    star(s.x,s.y,9*k,4.2*k,"#ffd166");}
  // trail + player
  for(let i=0;i<S.trail.length;i++){const tr=S.trail[i],a=i/S.trail.length;
    cx.globalAlpha=a*.5;cx.fillStyle="#fff7ec";cx.beginPath();cx.arc(tr.x,tr.y,6*a+1,0,7);cx.fill();}
  cx.globalAlpha=1;
  if(S.mode!=="over"){cx.shadowColor="#fff7ec";cx.shadowBlur=16;cx.fillStyle="#fff7ec";cx.beginPath();cx.arc(S.p.x,S.p.y,8,0,7);cx.fill();cx.shadowBlur=0;}
  for(const b of S.bursts){cx.globalAlpha=Math.max(0,b.life/.7);cx.fillStyle=b.col;cx.beginPath();cx.arc(b.x,b.y,3,0,7);cx.fill();}
  cx.globalAlpha=1;
  cx.restore();
}
function star(x,y,R,r,col){cx.fillStyle=col;cx.shadowColor=col;cx.shadowBlur=10;cx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;cx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}
  cx.closePath();cx.fill();cx.shadowBlur=0;}

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(S)update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.addEventListener("visibilitychange",()=>{last=performance.now();});

cv.addEventListener("pointerdown",e=>{e.preventDefault();release();});
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();
  if(S&&S.mode==="play")release();else if(!document.getElementById("ov").hidden)start();}});
document.getElementById("go").onclick=start;
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
